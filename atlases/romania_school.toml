[[pages]]
title = "Clima: tipurile de climat"
text = """
România are un climat temperat-continental, cu patru anotimpuri bine definite. În clasificarea
Köppen-Geiger, cea mai mare parte a țării are un climat continental (grupa D), cu veri calde în
sud și est și mai răcoroase în nord și vest. În munți clima devine tot mai rece, iar pe cele
mai înalte culmi apare clima alpină (grupa E). Cheia de sub hartă numește fiecare clasă.
"""
questions = [
    "Ce clasă climatică are regiunea în care locuiești?",
    "Cum se schimbă clima odată cu altitudinea?",
    "De ce sunt verile mai calde în Câmpia Română decât în Podișul Transilvaniei?",
]
[pages.map]
