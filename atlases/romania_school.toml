Cantitatea de precipitații crește cu altitudinea și scade, în general, de la vest la est.
Munții primesc peste 1.000 mm pe an, iar culmile cele mai înalte și expuse vânturilor de vest,
mai ales în Munții Apuseni, peste 1.200–1.400 mm. Dobrogea, litoralul și Delta Dunării, cu sub
400–450 mm pe an, sunt cele mai uscate regiuni ale țării.
"""
