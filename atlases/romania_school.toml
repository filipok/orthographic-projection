Temperatura medie anuală scade de la peste 11 °C în sudul Câmpiei Române și pe litoral la sub
−2 °C pe cele mai înalte vârfuri ale Carpaților. Altitudinea contează cel mai mult: temperatura
aerului scade, în medie, cu circa 6 °C la fiecare 1.000 m. Harta arată mediile din anii
1981–2010.
"""
questions = [
    "Care sunt cele mai calde regiuni ale țării? Explică de ce.",
    "Compară temperatura medie din Câmpia de Vest cu cea din Podișul Moldovei.",
]
