Solurile se formează în funcție de climă, rocă, relief și vegetație. În câmpiile din sud și
est, sub fostele stepe și silvostepe, se află cernoziomurile (Chernozems), cele mai fertile
soluri ale țării. Pe dealuri și podișuri predomină luvisolurile și solurile brune, iar la munte
solurile acide (cambisoluri, podzoluri). Cheia numește grupele de sol după sistemul
internațional WRB.
"""
