# Atlas geografic școlar: România, Uniunea Europeană și lumea.
#
# Build it with:   python atlas.py atlases/romania_school.toml
# Check the text:  python atlas.py atlases/romania_school.toml --proof   (no maps drawn, seconds)
#
# Every [[pages]] table is one page, in order. Edit the titles, the text and the questions,
# move pages, delete them or add new ones; a [pages.map] table holds the map's options exactly
# as a recipe does (see "Recipe Files" in the README). Only the maps whose options change are
# drawn again. The web app (python webapp.py, then "Atlases") edits this file too.

title = "Atlas geografic școlar"
subtitle = "România · Uniunea Europeană · Lumea"
edition = "Ediția 2026"
language = "ro"
paper = "a4"
dpi = 120
text_scale = 2      # the maps print about 6 in wide: names, lines and keys twice as large
notes = "appendix"  # the captions and questions at the back, so each map takes the page's width

[cover.map]
lat = 45.95
lon = 24.95
provider = "nasa"
no-circles = true

# ---------------------------------------------------------------------------------------------
# Partea I: România
# ---------------------------------------------------------------------------------------------

[[pages]]
type = "section"
title = "România"
text = """
România se află în sud-estul Europei Centrale, la nord de Peninsula Balcanică, pe cursul
inferior al Dunării și cu ieșire la Marea Neagră. Are o suprafață de 238.397 km² și peste
19 milioane de locuitori.

Hărțile din această parte arată poziția țării, relieful, apele, clima, vegetația, solurile,
populația, orașele și economia, apoi felul în care s-a format teritoriul României.
"""

[[pages]]
title = "Poziția geografică a României"
text = """
România se află în emisfera nordică și în emisfera estică, aproape la jumătatea distanței
dintre Ecuator și Polul Nord: paralela de 45° latitudine nordică trece prin sudul țării, iar
meridianul de 25° longitudine estică o străbate de la nord la sud. Cercurile arată distanțele
de 2.500 km și 5.000 km față de București.
"""
questions = [
    "În ce emisferă se află România față de Ecuator? Dar față de meridianul Greenwich?",
    "Ce continente se află, cel puțin în parte, la mai puțin de 5.000 km de București?",
    "Numește trei state aflate la mai puțin de 2.500 km de București.",
]
[pages.map]
lat = 45.95
lon = 24.95
provider = "natural_earth"
circles-from = "44.43,26.10"

[[pages]]
title = "Harta fizică a României"
text = """
Relieful României este variat și dispus aproape concentric: în centru se află Podișul
Transilvaniei, înconjurat de arcul Carpaților; spre exterior urmează dealurile și podișurile,
iar la margine câmpiile și Delta Dunării. Munții ocupă circa 31% din suprafață, dealurile și
podișurile 36%, iar câmpiile 33%. Cel mai înalt vârf este Moldoveanu (2.544 m), în Munții
Făgărașului.
"""
questions = [
    "Numește cele trei ramuri ale Carpaților Românești.",
    "Unde se află Câmpia Română față de Carpații Meridionali?",
    "Ce înseamnă că relieful României este dispus „în trepte” și „concentric”?",
]
[pages.map]
lat = 45.95
lon = 24.95
provider = "osm_local"
radius = 450
no-circles = true
elevation = true

[[pages]]
title = "Unitățile majore de relief"
text = """
Geografii împart relieful României în 16 unități majore, după Posea și Badea (1984). Carpații
au cinci ramuri: Orientali, de Curbură, Meridionali, ai Banatului și Apuseni. În interiorul
arcului se află Depresiunea Transilvaniei, iar în afara lui Subcarpații, apoi dealurile și
podișurile: Dealurile Crișanei și Silvaniei, Dealurile Banatului, Podișul Mehedinți,
Piemontul Getic, Podișul Moldovei și Podișul Dobrogei. La margine se întind Câmpia
Banato-Crișană, Câmpia Română și Delta Dunării.
"""
questions = [
    "Ce unități majore de relief înconjoară Depresiunea Transilvaniei?",
    "Între ce ramuri ale Carpaților se află Carpații de Curbură?",
    "În ce unitate majoră de relief se află localitatea ta? Dar unitățile vecine?",
]
[pages.map]
lat = 45.9
lon = 25.2
provider = "nasa"
radius = 390
no-circles = true
relief-units = "regions"
relief-alpha = 0.45

[[pages]]
title = "Munții și depresiunile din estul Transilvaniei"
text = """
O unitate majoră de relief cuprinde unități tot mai mici: munți, depresiuni, dealuri și
câmpii. În Carpații Orientali, între Munții Harghita, lanț vulcanic, și Munții Ciucului se
înșiră Depresiunile Gheorgheni-Ciuc: prin cea a Gheorghenilor (Giurgeului) curge Mureșul spre
nord, prin a Ciucului curge Oltul spre sud. Oltul trece apoi prin Depresiunea Brașovului, cu
Țara Bârsei. La vest de Harghita, în jurul Odorheiului Secuiesc, se află Subcarpații
Homoroadelor. Cu litere îngroșate sunt scrise unitățile mai mari, care le cuprind pe cele mici.
"""
questions = [
    "Ce râuri curg prin Depresiunile Gheorgheni-Ciuc? În ce direcție curge fiecare?",
    "Cum s-au format Munții Harghita? Prin ce se deosebesc de Munții Ciucului?",
    "De ce s-au dezvoltat orașele în depresiuni, nu pe munți?",
]
[pages.map]
