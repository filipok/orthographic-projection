În ianuarie, temperatura medie este negativă aproape peste tot: între 0 °C și −4 °C în câmpii
și podișuri, sub −10 °C pe culmile Carpaților. Litoralul Mării Negre are iernile cele mai
blânde. Iarna, Crivățul, un vânt rece și uscat dinspre est, aduce geruri și viscole în Moldova,
în Bărăgan și în Dobrogea.
"""
