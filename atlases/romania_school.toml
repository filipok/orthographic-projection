[[pages]]
title = "Apele: râurile, Dunărea și Marea Neagră"
text = """
Aproape toate râurile României se varsă în Dunăre, care formează cea mai mare parte a graniței
de sud și se varsă în Marea Neagră prin Delta Dunării, pe trei brațe: Chilia, Sulina și
Sfântu Gheorghe. Rețeaua de râuri este radială: ele coboară din Carpați spre toate zările.
Dunărea parcurge 1.075 km pe teritoriul României sau la granița ei. În fața Dobrogei, Marea
Neagră are o platformă continentală largă și puțin adâncă.
"""
questions = [
    "Numește trei râuri care izvorăsc din Carpații Orientali.",
    "Care sunt cele trei brațe ale Dunării în Deltă? Pe care dintre ele circulă navele mari?",
    "De ce este importantă platforma continentală a Mării Negre?",
]
