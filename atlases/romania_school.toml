[[pages]]
title = "Câmpiile din nord-vestul țării"
text = """
Câmpia Someșului face parte din Câmpia Banato-Crișană. În ea, de-a lungul râului Ier,
se află Câmpia Ierului, o câmpie joasă, odinioară mlăștinoasă, desecată în secolul al XX-lea.
Chiar alături, în jurul Careiului, se întinde Câmpia Careiului, o câmpie nisipoasă, cu dune
fixate de vii și de păduri; ea are două părți, Câmpia Valea lui Mihai și Câmpia Pișcolțului,
și continuă în Ungaria cu câmpia Nyírség. Deși sunt vecine, cele două câmpii arată și se
folosesc foarte diferit.
"""
questions = [
    "Prin ce se deosebesc Câmpia Ierului și Câmpia Careiului? Ce s-a cultivat pe fiecare?",
    "Ce înseamnă că o mlaștină a fost „desecată”? Ce s-a câștigat și ce s-a pierdut?",
    "Ce oraș se află pe Someș, la nord-est de Câmpia Careiului?",
]
[pages.map]
