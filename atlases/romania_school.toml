text = """
Harta arată acoperirea terenului observată din satelit (MODIS, 2024): pădurile acoperă munții
și dealurile înalte, iar terenurile agricole domină câmpiile și podișurile. Pădurile ocupă
aproximativ 29% din suprafața țării. Vegetația este etajată după altitudine: stepă și
silvostepă în câmpie, păduri de stejar pe dealuri, păduri de fag și apoi de molid la munte,
pajiști alpine pe culmi.
"""
questions = [
    "Ce tip de acoperire a terenului domină în Câmpia Română? Dar în Carpați?",
