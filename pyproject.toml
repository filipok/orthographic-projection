[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orthographic-projection"
version = "1.0.0"
description = "Generate high-resolution orthographic globe maps from web map tiles."
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"

dependencies = [
    "cartopy>=0.25.0",
    "matplotlib>=3.10.0",
    "numpy>=2.4.0",
    "pyproj>=3.7.0",
    "shapely>=2.1.0",
    "scipy>=1.17.0",
    "pillow>=12.1.0",
    "python-dotenv>=1.2.0",
    "h5py>=3.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ortho = "ortho:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
py-modules = ["ortho", "koppen", "trewartha", "elevation", "soil", "soil_properties", "ice", "crops", "rotation", "routes", "google_tiles", "tile_fetch"]
